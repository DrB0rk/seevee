name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - name: Run installer contract tests
        run: pnpm test:installer

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Schema drift check
        run: pnpm schema:drift

      - name: Build all bundles
        run: ./scripts/bundle-all.sh dist/release

      - name: Verify every release bundle
        run: |
          for archive in dist/release/seevee-*; do
            case "$archive" in
              *linux-x64*) ./scripts/verify_bundle.sh "$archive" ;;
              *) SEEVEE_SKIP_DAEMON_SMOKE=1 ./scripts/verify_bundle.sh "$archive" ;;
            esac
          done
      - name: Verify Unix installer end to end
        run: ./scripts/test_install_e2e.sh dist/release/seevee-linux-x64.tar.gz


      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/release/seevee-linux-x64.tar.gz
            dist/release/seevee-linux-arm64.tar.gz
            dist/release/seevee-darwin-x64.tar.gz
            dist/release/seevee-darwin-arm64.tar.gz
            dist/release/seevee-windows-x64.zip
            dist/release/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
